<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GTD Flow</title>
<meta name="description" content="A complete Getting Things Done (GTD) app: Inbox, Clarify, Next Actions, Projects, Waiting For, Someday/Maybe, Calendar/Tickler, Reference, Weekly Review, and Horizons of Focus — with automatic Google Drive backup." />
<meta name="theme-color" content="#1b6f6f" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GTD Flow" />
<link rel="stylesheet" href="./css/styles.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app-shell">
    <header id="topbar">
      <button id="nav-toggle" aria-label="Toggle menu">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
      </button>
      <span class="logo-badge">GTD</span>
      <span class="brand-name">GTD Flow</span>
      <div class="topbar-spacer"></div>
      <button id="install-btn" class="btn btn-ghost btn-small" hidden>
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Install app
      </button>
    </header>

    <nav id="sidebar">
      <div class="nav-section-label">Workflow</div>
      <a class="nav-link" href="#/inbox"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M4 12 6 5h12l2 7"/><path d="M4 12v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/></svg> Inbox <span id="inbox-badge" class="badge-count"></span></a>
      <a class="nav-link" href="#/clarify"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-6 2 2-6 6-2Z"/></svg> Clarify</a>
      <a class="nav-link" href="#/next-actions"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg> Next Actions <span id="next-actions-badge" class="badge-count badge-count-neutral"></span></a>
      <a class="nav-link" href="#/projects"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/></svg> Projects <span id="projects-badge" class="badge-count badge-count-neutral"></span></a>
      <a class="nav-link" href="#/waiting-for"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg> Waiting For <span id="waiting-for-badge" class="badge-count badge-count-neutral"></span></a>
      <a class="nav-link" href="#/someday"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 17l-5.6 3.1 1.4-6.3L3 9.5l6.4-.6L12 3Z"/></svg> Someday/Maybe</a>
      <a class="nav-link" href="#/calendar"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg> Calendar &amp; Tickler</a>
      <a class="nav-link" href="#/reference"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M17 4h2v16h-2"/></svg> Reference</a>
      <a class="nav-link" href="#/review"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3L4 16"/><path d="M4 20v-4h4"/></svg> Weekly Review</a>

      <div class="nav-section-label">Bigger Picture</div>
      <a class="nav-link" href="#/horizons"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg> Horizons of Focus</a>

      <div class="nav-section-label">App</div>
      <a class="nav-link" href="#/settings"><svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg> Settings &amp; Backup</a>
    </nav>

    <main id="view-root" aria-live="polite"></main>
  </div>

  <div id="modal-host"></div>
  <div id="toast-host"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
